name: Gojo Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  group-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run group settings regression tests
        run: python -m pytest -q tests/test_group_settings.py
